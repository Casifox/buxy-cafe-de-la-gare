<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prévisualisation — Pizzeria Café de la Gare</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #e9e9e9; color: #222; font: 14px/1.5 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 24px; color: #555; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; margin: 28px 0 10px; color: #666; }
    .frame { overflow: hidden; border: 1px solid #bbb; background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    .frame iframe { display: block; border: 0; transform-origin: top left; background: #fff; }
    .frame--desktop { width: 720px; height: 450px; }
    .frame--desktop iframe { width: 1440px; height: 900px; transform: scale(.5); }
    .frame--tablet { width: 629px; height: 536px; }
    .frame--tablet iframe { width: 786px; height: 670px; transform: scale(.8); }
    .frame--mobile { width: 390px; height: 844px; }
    .frame--mobile iframe { width: 390px; height: 844px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
    .links a { padding: 8px 12px; background: #1e2430; color: #fff; text-decoration: none; border-radius: 3px; font-size: 12px; }
    @media (max-width: 780px) {
      .frame--desktop, .frame--tablet { width: 100%; height: auto; }
      .frame--desktop iframe, .frame--tablet iframe { width: 100%; height: 640px; transform: none; }
    }
  </style>
</head>
<body>
  <h1>Prévisualisation du site</h1>
  <p>Outil de développement — non indexé. Les cadres utilisent la largeur réelle pour tester les media queries.</p>

    <a href="../confidentialite.html" target="_blank" rel="noopener">Confidentialité</a>
    <a href="../404.html" target="_blank" rel="noopener">404</a>
  </div>

  <h2>Desktop — 1440 px</h2>
  <div class="frame frame--desktop">
    <iframe src="../index.html" title="Aperçu desktop de l’accueil"></iframe>
  </div>

  <h2>Tablette — 786 px</h2>
  <div class="frame frame--tablet">
    <iframe src="../index.html" title="Aperçu tablette de l’accueil"></iframe>
  </div>

  <h2>Mobile — 390 px</h2>
  <div class="frame frame--mobile">
    <iframe src="../index.html" title="Aperçu mobile de l’accueil"></iframe>
  </div>

  <h2>Desktop — carte</h2>
